<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Metro Auto all categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#E1251B}a:hover{color:#B71C14}
:focus-visible{outline:3px solid #2F6FD6;outline-offset:2px}
.mx-wrap{max-width:1320px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.mx-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mx-tile:hover{border-color:#E1251B !important}
@media (max-width:640px){
 .mx-wrap{padding:0 16px}
 .mx-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .mx-tile{min-height:56px !important;padding:8px 10px !important;gap:8px !important}
 .mx-tile > svg{display:none}
 .mx-tile-icon{width:28px !important;height:28px !important}
 .mx-tile-label{font-size:14px !important}
 .mx-grp-title{font-size:24px !important}
 .mx-grp-icon{width:34px !important;height:34px !important}
 .mx-title{font-size:40px !important}
}
@media (max-width:640px){
 .mx-wrap{padding-left:12px !important;padding-right:12px !important}
 .mx-banner{padding-top:22px !important;padding-bottom:22px !important}
 .mx-title{font-size:32px !important}
 .mx-h1{font-size:36px !important}
 .mx-h2{font-size:26px !important}
 .mx-section{padding-top:36px !important}
 .mx-grid,.mx-pair{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
}
@media (max-width:640px){.mx-groups{gap:28px !important;padding-top:20px !important}}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #121316; background: #FFFFFF; min-height: 100vh">
<dc-import name="Header" current="collections" hint-size="100%,210px"></dc-import>

<section style="background: radial-gradient(circle at 85% 30%, rgba(225,37,27,0.3), rgba(225,37,27,0) 50%), #121316; color: #FFFFFF">
 <div class="mx-wrap mx-banner" style="padding-top: 36px; padding-bottom: 36px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 32px; flex-wrap: wrap">
  <div style="display: flex; flex-direction: column; gap: 10px; max-width: 640px">
   <nav aria-label="Breadcrumb" style="font-size: 13px; color: #B9BCC3; display: flex; gap: 8px"><a href="Main.dc.html" style="color: #B9BCC3">Home</a><span aria-hidden="true">/</span><span style="color: #FFFFFF">All categories</span></nav>
   <h1 class="mx-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 0.95; text-transform: uppercase">All categories</h1>
   <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #D4D6DB">Every part we sell, grouped the way you'd look for it in the workshop.</p>
  </div>
  <label style="display: flex; align-items: center; gap: 10px; border-radius: 6px; padding: 0 14px; min-height: 48px; background: #FFFFFF; flex: 0 1 380px">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62666D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
   <input value="{{filter}}" onChange="{{onFilter}}" aria-label="Find a category" placeholder="Find a category, for example filters" style="border: 0; outline: none; font-family: inherit; font-size: 15px; flex: 1; min-width: 0; color: #121316">
  </label>
 </div>
</section>

<div class="mx-wrap mx-groups" style="padding-top: 36px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 44px">
 <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
  <section aria-labelledby="{{g.id}}" style="display: flex; flex-direction: column; gap: 14px">
   <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 3px solid #E1251B">
    <h2 class="mx-grp-title" id="{{g.id}}" style="margin: 0; display: flex; align-items: center; gap: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; line-height: 1; text-transform: uppercase">
     <span class="mx-grp-icon" style="width: 44px; height: 44px; border-radius: 8px; background: #E1251B; display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>{{g.name}}
    </h2>
    <a href="Collection.dc.html" onClick="{{g.go}}" style="font-weight: 600; font-size: 15px">Shop all {{g.short}}</a>
   </div>
   <div class="mx-tiles">
    <sc-for list="{{g.items}}" as="c" hint-placeholder-count="6">
     <a class="mx-tile" href="Collection.dc.html" onClick="{{c.go}}" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 14px; border-radius: 8px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #121316; text-decoration: none">
      <span class="mx-tile-icon" style="width: 36px; height: 36px; border-radius: 6px; background: #FDECEB; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E1251B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>
      <span class="mx-tile-label" style="flex: 1; font-weight: 500; font-size: 15px; line-height: 1.3">{{c.label}}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
     </a>
    </sc-for>
   </div>
  </section>
 </sc-for>
 <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
  <div style="border: 1px solid #E4E4E7; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: #F4F4F5">
   <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase">No category called "{{filter}}"</h2>
   <p style="margin: 0; font-size: 15px; color: #3F4249">Try searching for the part itself instead.</p>
   <a href="Search.dc.html" onClick="{{searchIt}}" style="min-height: 44px; padding: 0 18px; border-radius: 6px; background: #E1251B; color: #FFFFFF; display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 14px">Search for "{{filter}}"</a>
  </div>
 </sc-if>
</div>

<dc-import name="Footer" hint-size="100%,500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
function csSet(k,v){try{window.localStorage.setItem(k,JSON.stringify(v));}catch(e){}try{window.dispatchEvent(new Event(k));}catch(e){}}
var CS_GROUPS=[
 {name:"Brakes and suspension", short:"brakes and suspension", icon:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z", items:["Brake pads","Brake care","Braking system","Suspension","Steering","Brake fluids"]},
 {name:"Service and electrical", short:"service parts", icon:"M13 2L5 14h6l-1 8 8-12h-6z", items:["Lubricants and aerosols","Cleaners","Filters and maintenance","Ignition system","Electrical and charging","Care and fluids"]},
 {name:"Performance and engine", short:"engine parts", icon:"M4 10h3l2-3h6l2 3h3v7H4zM7 7V5M17 7V5M9 13h6", items:["Vacuum and breather hose","Engine components","Cooling system","Drivetrain","Fuel system","Timing belts and kits","Water pumps"]},
 {name:"Body and accessories", short:"body and accessories", icon:"M3 15l2-5a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 5v3H3zM7 18v2M17 18v2", items:["Body clips and fasteners","Body and exterior parts","Wiper arms and parts","Exterior accessories","Interior accessories","Struts, bonnet and body"]},
 {name:"Workshop essentials", short:"workshop essentials", icon:"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z", items:["Wheel nuts and studs","Kits and service packs","Workshop trays and assortments"]}
];
class Component extends DCLogic {
 constructor(props){ super(props); this.state = {filter:""}; }
 renderVals(){
  var f = this.state.filter.trim().toLowerCase();
  var groups = CS_GROUPS.map((g,i) => Object.assign({}, g, {
   id: "mx-grp-" + i,
   go: () => csSet("ma-col", g.name),
   items: g.items.filter(i => !f || i.toLowerCase().indexOf(f) > -1 || g.name.toLowerCase().indexOf(f) > -1).map(i => ({label:i, go:() => csSet("ma-col", i)}))
  })).filter(g => g.items.length > 0);
  return {
   filter: this.state.filter, onFilter: e => this.setState({filter:e.target.value}),
   groups: groups, none: groups.length === 0,
   searchIt: () => { csSet("ma-tag",""); csSet("ma-q", this.state.filter.trim()); }
  };
 }
}
</script>
</body>
</html>
