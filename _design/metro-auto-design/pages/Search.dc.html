<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Metro Auto search results</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#E1251B}a:hover{color:#B71C14}
:focus-visible{outline:3px solid #2F6FD6;outline-offset:2px}
.mx-wrap{max-width:1320px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.mx-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.mx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mx-filter-btn{display:none !important}
@media (max-width:1100px){.mx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
 .mx-layout{grid-template-columns:1fr}
 .mx-filter-btn{display:inline-flex !important}
 .mx-side-closed{display:none !important}
}
@media (max-width:640px){
 .mx-wrap{padding:0 16px}
 .mx-grid{gap:10px}
 .mx-title{font-size:34px !important}
}
@media (max-width:640px){
 .mx-wrap{padding-left:12px !important;padding-right:12px !important}
 .mx-banner{padding-top:22px !important;padding-bottom:22px !important}
 .mx-title{font-size:32px !important}
 .mx-h1{font-size:36px !important}
 .mx-h2{font-size:26px !important}
 .mx-section{padding-top:36px !important}
 .mx-grid,.mx-pair{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
}
.mx-vrow{display:none !important}
@media (max-width:640px){

 .mx-toolbar{display:grid !important;grid-template-columns:auto minmax(0,1fr);gap:8px 10px !important;padding:8px !important}

 .mx-sortlabel{justify-self:end;font-size:0 !important;gap:0 !important}

</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #121316; background: #FFFFFF; min-height: 100vh">
<dc-import name="Header" current="search" hint-size="100%,210px"></dc-import>

<section style="background: #F4F4F5; border-bottom: 1px solid #E4E4E7">
 <div class="mx-wrap mx-banner" style="padding-top: 24px; padding-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap">
  <div style="display: flex; flex-direction: column; gap: 8px; max-width: 800px">
   <nav aria-label="Breadcrumb" style="font-size: 13px; color: #62666D; display: flex; gap: 8px"><a href="Main.dc.html" style="color: #62666D">Home</a><span aria-hidden="true">/</span><span style="color: #121316">Search</span></nav>
   <h1 class="mx-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase">{{title}}</h1>
   <p class="mx-sub" style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F4249">{{subtitle}}</p>
  </div>
  <sc-if value="{{showChange}}" hint-placeholder-val="{{ true }}">
   <button class="mx-change" onClick="{{openGarage}}" style="min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #121316; background: #FFFFFF; color: #121316; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Change vehicle</button>
  </sc-if>
 </div>
</section>

<div class="mx-wrap" style="padding-top: 24px; padding-bottom: 64px">
 <div class="mx-layout">
  <!-- Search & Discovery style filters (fed by Shopify filters on the live site) -->
  <aside class="{{sideClass}}" aria-label="Filters" style="border: 1px solid #E4E4E7; border-radius: 8px; overflow: hidden; background: #FFFFFF">
   <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #121316; color: #FFFFFF">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em">Filters</h2>
    <button onClick="{{clearFilters}}" style="border: 0; background: transparent; color: #FF8A82; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 32px">Clear all</button>
   </div>
   <sc-for list="{{facets}}" as="f" hint-placeholder-count="5">
    <div style="border-bottom: 1px solid #F0F0F2">
     <button onClick="{{f.toggle}}" aria-expanded="{{f.expanded}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-weight: 600; font-size: 15px; color: #121316; cursor: pointer; text-align: left">
      <span style="display: inline-flex; align-items: center; gap: 8px">{{f.name}}<sc-if value="{{f.hasSel}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 99px; background: #E1251B; color: #FFFFFF; font-size: 12px; display: inline-grid; place-items: center">{{f.selCount}}</span></sc-if></span>
      <span aria-hidden="true" style="font-size: 20px; color: #62666D; line-height: 1">{{f.sign}}</span>
     </button>
     <sc-if value="{{f.open}}" hint-placeholder-val="{{ true }}">
      <div style="padding: 0 16px 14px; display: flex; flex-direction: column">
       <sc-if value="{{f.isList}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{f.opts}}" as="o" hint-placeholder-count="4">
         <label style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; cursor: pointer; color: {{o.color}}">
          <input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" disabled="{{o.disabled}}" style="width: 17px; height: 17px; accent-color: #E1251B; margin: 0">
          <span style="flex: 1">{{o.label}}</span><span style="font-size: 13px; color: #62666D">({{o.count}})</span>
         </label>
        </sc-for>
       </sc-if>
       <sc-if value="{{f.isPrice}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0 0 10px; font-size: 13px; color: #62666D">The highest price is {{f.max}}</p>
        <div style="display: flex; gap: 8px; align-items: center">
         <label style="flex: 1; display: flex; align-items: center; gap: 4px; border: 1px solid #C9CBD0; border-radius: 6px; padding: 0 8px; min-height: 40px; font-size: 14px; color: #62666D">$<input inputmode="decimal" value="{{f.from}}" onChange="{{f.onFrom}}" aria-label="Price from" placeholder="From" style="border: 0; outline: none; width: 100%; min-width: 0; font-family: inherit; font-size: 14px; color: #121316"></label>
         <span aria-hidden="true" style="color: #62666D">to</span>
         <label style="flex: 1; display: flex; align-items: center; gap: 4px; border: 1px solid #C9CBD0; border-radius: 6px; padding: 0 8px; min-height: 40px; font-size: 14px; color: #62666D">$<input inputmode="decimal" value="{{f.to}}" onChange="{{f.onTo}}" aria-label="Price to" placeholder="To" style="border: 0; outline: none; width: 100%; min-width: 0; font-family: inherit; font-size: 14px; color: #121316"></label>
        </div>
       </sc-if>
      </div>
     </sc-if>
    </div>
   </sc-for>
   <div style="padding: 14px 16px">
    <button onClick="{{toggleSide}}" style="width: 100%; min-height: 44px; border-radius: 6px; border: 0; background: #E1251B; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Show {{count}} results</button>
   </div>
  </aside>

  <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
   <div class="mx-toolbar" style="border: 1px solid #E4E4E7; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
    <button class="mx-filter-btn" onClick="{{toggleSide}}" style="align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 6px; border: 1px solid #121316; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; color: #121316">{{sideLabel}}</button>
    <div class="mx-tb-count" style="display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; align-items: center">
     <span style="font-size: 14px; color: #3F4249">{{count}} {{countWord}}</span>
     <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
      <button onClick="{{c.remove}}" aria-label="Remove {{c.label}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid {{c.border}}; background: {{c.bg}}; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer; color: #121316">{{c.label}} <span aria-hidden="true" style="font-size: 16px; line-height: 1">×</span></button>
     </sc-for>
    </div>
    <label class="mx-sortlabel" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #62666D">Sort by
     <select aria-label="Sort by" value="{{sort}}" onChange="{{onSort}}" style="min-height: 42px; border: 1px solid #C9CBD0; border-radius: 6px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #121316; background: #FFFFFF">
      <option value="best">Relevance</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option><option value="az">Alphabetically, A to Z</option>
     </select>
    </label>
   </div>

   <!-- PHONE: the vehicle these results are matched to, in its own row under the filter bar -->
   <div class="mx-vrow" style="align-items: center; gap: 10px; border: 1px solid {{vrBorder}}; background: {{vrBg}}; border-radius: 8px; padding: 10px 12px">
    <span style="width: 36px; height: 36px; border-radius: 99px; background: {{vrDot}}; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16l1.5-5A2 2 0 0 1 8.4 9.5h7.2a2 2 0 0 1 1.9 1.5L19 16"></path><rect x="3" y="16" width="18" height="4" rx="1.5"></rect></svg></span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
     <span style="font-size: 12px; color: #3F4249">{{vrKicker}}</span>
     <strong style="font-size: 15px; font-weight: 600; color: #121316; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{vrLabel}}</strong>
    </span>
    <button onClick="{{openGarage}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #121316; background: #FFFFFF; color: #121316; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer">{{vrBtn}}</button>
   </div>

   <sc-if value="{{hasMain}}" hint-placeholder-val="{{ true }}">
    <div class="mx-grid">
     <sc-for list="{{main}}" as="p" hint-placeholder-count="6">
      <dc-import name="ProductCard" item="{{p}}" hint-size="100%,520px"></dc-import>
     </sc-for>
    </div>
   </sc-if>
   <sc-if value="{{noMain}}" hint-placeholder-val="{{ false }}">
    <div style="border: 1px solid #E4E4E7; border-radius: 10px; padding: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; background: #F4F4F5">
     <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase">{{emptyTitle}}</h2>
     <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F4249; max-width: 620px">{{emptyText}}</p>
     <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <a href="Contact.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 6px; background: #E1251B; color: #FFFFFF; display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 14px">Ask us to find the part</a>
      <button onClick="{{clearAll}}" style="min-height: 44px; padding: 0 18px; border-radius: 6px; border: 1px solid #121316; background: #FFFFFF; color: #121316; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Clear search and filters</button>
     </div>
    </div>
   </sc-if>

   <sc-if value="{{hasUni}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 24px">
     <div>
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase">Also suits your {{model}}</h2>
      <p style="margin: 4px 0 0; font-size: 15px; color: #3F4249">Sprays, cleaners and care products that work on any vehicle.</p>
     </div>
     <div class="mx-grid">
      <sc-for list="{{uni}}" as="p" hint-placeholder-count="3">
       <dc-import name="ProductCard" item="{{p}}" hint-size="100%,520px"></dc-import>
      </sc-for>
     </div>
    </div>
   </sc-if>
  </div>
 </div>
</div>

<dc-import name="Footer" hint-size="100%,500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2600}}'>

class Component extends DCLogic {
 constructor(props){ super(props); this.state = Object.assign({vehicle:gLoad().vehicle, q:MS.get("ma-q",""), tag:MS.get("ma-tag",""), open:{stock:true,price:true,vendor:true,col:true,dept:false}, sort:"best", sideOpen:false}, initF()); }

    toggle: () => { var o = Object.assign({}, st.open); o[id] = !o[id]; this.setState({open:o}); },
    hasSel: st.sel[id].length > 0, selCount: st.sel[id].length,
    opts: vals.map(val => { var n = counts[val] || 0; return {label:val, count:n, on: st.sel[id].indexOf(val) > -1, disabled: n===0 && st.sel[id].indexOf(val) < 0, color: n===0 ? "#9A9EA6" : "#121316", toggle:() => this.toggleOpt(id, val)}; })};
  };
  var maxP = all.reduce((m,p) => Math.max(m, p.price), 0);
  var priceSel = (!isNaN(from) ? 1 : 0) + (!isNaN(to) ? 1 : 0);
  var facets = [
   listFacet("stock", "Availability", ["In stock","Out of stock"]),
   {name:"Price", isList:false, isPrice:true, open: !!st.open.price, sign: st.open.price ? "−" : "+", expanded: st.open.price ? "true" : "false",
    toggle: () => { var o = Object.assign({}, st.open); o.price = !o.price; this.setState({open:o}); },
    hasSel: priceSel > 0, selCount: priceSel, max: money(maxP), from: st.from, to: st.to,
    onFrom: e => this.setState({from: e.target.value.replace(/[^0-9.]/g,"")}), onTo: e => this.setState({to: e.target.value.replace(/[^0-9.]/g,"")})},
   listFacet("vendor", "Brand"),
   listFacet("col", "Product type"),
   listFacet("dept", "Category")
  ];
  var chips = [];
  if (mode==="make") chips.push({label:"Make: " + make, remove:() => MS.set("ma-q",""), bg:"#F4F4F5", border:"#D4D6DB"});
  if (mode==="q") chips.push({label:"Search: " + q, remove:() => MS.set("ma-q",""), bg:"#F4F4F5", border:"#D4D6DB"});
  if (mode==="tag") chips.push({label:"Tag: " + tag, remove:() => MS.set("ma-tag",""), bg:"#F4F4F5", border:"#D4D6DB"});
  if (mode==="vehicle") chips.push({label:"Fits " + vKey(v), remove:() => MS.fire("ma-open-garage"), bg:"#DCFCE7", border:"#86EFAC"});
  Object.keys(st.sel).forEach(k => st.sel[k].forEach(val => chips.push({label:val, remove:() => this.toggleOpt(k, val), bg:"#FFF6F5", border:"#F5B4AF"})));
  if (!isNaN(from) || !isNaN(to)) chips.push({label:"Price " + (isNaN(from) ? "$0" : money(from)) + " to " + (isNaN(to) ? "any" : money(to)), remove:() => this.setState({from:"", to:""}), bg:"#FFF6F5", border:"#F5B4AF"});
  var n = main.length;
  return {
   title: {make:"Parts for " + make + " vehicles", q:"Results for “" + q + "”", tag:"Parts tagged “" + tag + "”", vehicle:"Parts for your " + vKey(v), all:"All parts"}[mode],
   subtitle: {make: n + (n===1 ? " part is" : " parts are") + " tagged for " + make + " models. Add your exact vehicle to narrow it down.", q: n + (n===1 ? " part matches" : " parts match") + " your search." + (v ? " Parts that fit your " + v.model + " are marked." : ""), tag: n + (n===1 ? " part has" : " parts have") + " this tag.", vehicle: n + (n===1 ? " part is" : " parts are") + " tagged for this vehicle. Products that suit any car are further down.", all: "Add your vehicle to see only the parts that fit."}[mode],
   showChange: mode==="vehicle" || mode==="all" || mode==="make",
   vrLabel: v ? vKey(v) : (make ? make + " (any model)" : "No vehicle selected"),
   vrKicker: v ? (function(k){ return k ? k + (k===1 ? " part here fits" : " parts here fit") + " your car" : "Shopping for"; })(main.filter(p => p.fitOk).length) : "Add your car to see what fits",
   vrBtn: v ? "Change" : "Add vehicle",
   vrBg: v ? "#DCFCE7" : "#F4F4F5", vrBorder: v ? "#86EFAC" : "#E4E4E7", vrDot: v ? "#15803D" : "#121316",
   openGarage: () => MS.fire("ma-open-garage"),
   facets: facets, chips: chips,
   count: main.length + uni.length, countWord: (main.length + uni.length)===1 ? "product" : "products",
   main: main, hasMain: n > 0, noMain: n === 0,
   uni: uni, hasUni: uni.length > 0, model: v ? v.model : "",
   emptyTitle: mode==="vehicle" ? "No parts tagged for your " + vKey(v) + " yet" : (mode==="make" ? "No parts tagged for " + make + " yet" : "No parts match"),
   emptyText: mode==="vehicle" || mode==="make" ? "Send us your rego or VIN and our team will find the right part." : "Check the spelling, try a part number, or clear a filter.",
   clearFilters: () => { this.setState({sel:{stock:[],vendor:[],col:[],dept:[]}, from:"", to:""}); try { window.localStorage.setItem("ma-brands","[]"); window.localStorage.setItem("ma-price","700"); } catch(e) {} },
   clearAll: () => { this.setState({sel:{stock:[],vendor:[],col:[],dept:[]}, from:"", to:""}); MS.set("ma-q",""); MS.set("ma-tag",""); },
   sort: st.sort, onSort: e => this.setState({sort:e.target.value}),
   sideClass: st.sideOpen ? "" : "mx-side-closed",
   sideLabel: st.sideOpen ? "Hide filters" : "Filters",
   toggleSide: () => this.setState({sideOpen: !st.sideOpen})
  };
 }
}
</script>
</body>
</html>
