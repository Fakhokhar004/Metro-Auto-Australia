</div>

<dc-import name="Footer" hint-size="100%,500px"></dc-import>
</div>

   col: c, hasParent: !!parent, parent: parent, goParent: goCol(parent),
   intro: c==="Deals" ? "Sale prices on parts and workshop products this week." : (totalInCol ? "Shop " + c.toLowerCase() + " from " + vendors.join(", ") + ", in stock in Melbourne." : "Browse " + c.toLowerCase() + " for your vehicle."),
   siblings: all.concat(sibs.map(s => ({label:s, name:s}))).map(s => { var on = s.name===c; return {label:s.label, go:goCol(s.name), on: on ? "true" : "false", border: on ? "#E1251B" : "#3A3D44", bg: on ? "#E1251B" : "#1F2125"}; }),
   facets: [
    listFacet("stock", "Availability", ["In stock","Out of stock"]),
    {name:"Price", isList:false, isPrice:true, open: !!st.open.price, sign: st.open.price ? "−" : "+", expanded: st.open.price ? "true" : "false",
     toggle: () => { var o = Object.assign({}, st.open); o.price = !o.price; this.setState({open:o}); },
     hasSel: priceSel > 0, selCount: priceSel, max: money(maxP), from: st.from, to: st.to,
     onFrom: e => this.setState({from: e.target.value.replace(/[^0-9.]/g,"")}), onTo: e => this.setState({to: e.target.value.replace(/[^0-9.]/g,"")})},
    listFacet("vendor", "Brand"),
    listFacet("col", "Product type")
   ],
   hasVehicle: !!v, model: v ? v.model : "",
   fitText: st.fitOnly ? "Showing parts tagged for your " + vKey(v) + ", plus products that suit any vehicle." : "Shopping for your " + vKey(v) + "? Turn this on to hide parts that don't fit.",
   fitBg: st.fitOnly ? "#DCFCE7" : "#F4F4F5", fitBorder: st.fitOnly ? "#86EFAC" : "#E4E4E7",
   fitAria: st.fitOnly ? "true" : "false", switchBg: st.fitOnly ? "#15803D" : "#9A9EA6", knob: st.fitOnly ? "19px" : "3px",
   toggleFit: () => this.setState({fitOnly: !st.fitOnly}),
   chips: chips,
   items: items.map(p => deco(p, v)), hasItems: items.length > 0, noItems: items.length === 0,
   count: items.length, countWord: items.length===1 ? "product" : "products",
   emptyTitle: totalInCol ? "Nothing matches these filters" : "Products for " + c.toLowerCase() + " are on their way",
   emptyText: totalInCol ? "Clear a filter or turn off vehicle matching to see everything in this category." : "We're adding this range to the website. Ask us and we'll check stock in the warehouse for you.",
   clearFilters: () => this.setState({sel:{stock:[],vendor:[],col:[]}, from:"", to:""}),
   sort: st.sort, onSort: e => this.setState({sort:e.target.value}),
   sideClass: st.sideOpen ? "" : "mx-side-closed", sideLabel: st.sideOpen ? "Hide filters" : "Filters",
   toggleSide: () => this.setState({sideOpen: !st.sideOpen})
  };
 }
}
</script>
</body>
</html>
