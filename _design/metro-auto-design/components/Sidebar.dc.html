<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Metro Auto sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="Shop filters" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #121316; display: flex; flex-direction: column; gap: 16px; width: 100%">
 <!-- categories -->
 <section style="border: 1px solid #E4E4E7; border-radius: 8px; overflow: hidden; background: #FFFFFF">
  <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #E1251B; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em">
   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16l-6 8v5l-4 2v-7z"></path></svg>Shop by category
  </h2>
  <ul style="list-style: none; margin: 0; padding: 4px 0">
   <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
    <li><a href="Collection.dc.html" onClick="{{c.go}}" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 16px; color: #121316; text-decoration: none; font-size: 14px; border-bottom: 1px solid #F0F0F2">
     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E1251B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
     <span style="flex: 1">{{c.label}}</span>
     <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9EA6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a></li>
   </sc-for>
  </ul>
 </section>

 <!-- price -->
 <section style="border: 1px solid #E4E4E7; border-radius: 8px; padding: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
  <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em">
   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E1251B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"></path></svg>Filter by price
  </h2>
  <label for="mx-price" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Maximum price</label>
  <input id="mx-price" type="range" min="10" max="700" step="10" value="{{price}}" onChange="{{onPrice}}" style="width: 100%; accent-color: #E1251B">
  <div style="display: flex; justify-content: space-between; font-size: 14px; color: #62666D">
   <span>$0</span><strong style="color: #E1251B; font-weight: 700">{{priceLabel}}</strong><span>$700+</span>
  </div>
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
   <a href="Search.dc.html" onClick="{{apply}}" style="min-height: 44px; border-radius: 6px; background: #121316; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px">Apply filter</a>
  </sc-if>
  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
   <button onClick="{{apply}}" style="min-height: 44px; border-radius: 6px; border: 0; background: #121316; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Apply filter</button>
  </sc-if>
 </section>

 <!-- brands -->
 <section style="border: 1px solid #E4E4E7; border-radius: 8px; padding: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
  <div style="display: flex; justify-content: space-between; align-items: center">
   <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em">Top brands</h2>
   <sc-if value="{{hasBrands}}" hint-placeholder-val="{{ false }}"><button onClick="{{clearBrands}}" style="border: 0; background: transparent; color: #E1251B; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 32px">Clear</button></sc-if>
  </div>
  <sc-for list="{{brands}}" as="b" hint-placeholder-count="7">
   <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer">
    <input type="checkbox" checked="{{b.on}}" onChange="{{b.toggle}}" style="width: 17px; height: 17px; accent-color: #E1251B; margin: 0">{{b.label}}
   </label>
  </sc-for>
 </section>

</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["home","live"],"default":"home"},"$preview":{"width":280,"height":900}}'>
var MS={get:function(k,d){try{var v=window.localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{window.localStorage.setItem(k,JSON.stringify(v));}catch(e){}MS.fire(k);},fire:function(k){try{window.dispatchEvent(new Event(k));}catch(e){}}};
var SB_CATS=[
 ["Brakes and suspension","Brakes and suspension","M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"],
 ["Filters and maintenance","Filters and maintenance","M4 5h16l-6 8v5l-4 2v-7z"],
 ["Kits and service packs","Kits and service packs","M4 7h16v12H4zM9 7V5h6v2"],
 ["Struts, bonnet and body","Struts, bonnet and body","M3 15l2-5a2 2 0 0 1 2-1.4h10a2 2 0 0 1 2 1.4l2 5v3H3z"],
 ["Lubricants and aerosols","Lubricants and aerosols","M9 4h6v3H9zM8 7h8v13H8z"],
 ["Cleaners","Cleaners","M10 3h4v3h-4zM9 6h6l1 3v11H8V9z"],
 ["Electrical and ignition","Electrical and charging","M13 2L5 14h6l-1 8 8-12h-6z"],
 ["Workshop essentials","Workshop essentials","M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"]
];
var SB_BRANDS=["CRC","HiQ","Goss","Penrite","Nulon","Hi-Tec","Caltex"];
class Component extends DCLogic {
 constructor(props){ super(props); this.state = {price: MS.get("ma-price", 700), brands: MS.get("ma-brands", [])}; }
 componentDidMount(){
  this.onF = () => this.setState({price: MS.get("ma-price", 700), brands: MS.get("ma-brands", [])});
  window.addEventListener("ma-price", this.onF); window.addEventListener("ma-brands", this.onF);
 }
 componentWillUnmount(){ window.removeEventListener("ma-price", this.onF); window.removeEventListener("ma-brands", this.onF); }
 renderVals(){
  var st = this.state, live = this.props.mode === "live";
  var setBrands = list => { this.setState({brands:list}); if (live) MS.set("ma-brands", list); };
  return {
   isHome: !live, isLive: live,
   cats: SB_CATS.map(c => ({label:c[0], icon:c[2], go:() => MS.set("ma-col", c[1])})),
   price: st.price, priceLabel: st.price >= 700 ? "Any price" : "Up to $" + st.price,
   onPrice: e => this.setState({price: +e.target.value}),
   apply: () => { MS.set("ma-price", st.price); MS.set("ma-brands", st.brands); if (!live) { MS.set("ma-q",""); MS.set("ma-tag",""); } },
   brands: SB_BRANDS.map(b => ({label:b, on: st.brands.indexOf(b) > -1, toggle:() => { var a = st.brands.slice(); var i = a.indexOf(b); if (i > -1) a.splice(i,1); else a.push(b); setBrands(a); }})),
   hasBrands: st.brands.length > 0, clearBrands: () => setBrands([]),
   getCode: () => MS.fire("ma-open-coupon")
  };
 }
}
</script>
</body>
</html>
